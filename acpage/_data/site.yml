about:
  - Hi, I am Qaiser Abbas, a PhD (CSE) student at <a href="https://www.hbku.edu.qa/en">HBKU</a> supervised by <a href="https://www.hbku.edu.qa/en/staff/jens-schneider">Dr. Jens Schneider</a> and <a href="https://www.hbku.edu.qa/en/staff/marco-agus">Dr. Marco Agus</a>. I completed my MSc from UET Lahore supervised by <a href="https://scholar.google.com/citations?user=WM9A5m4AAAAJ&hl=en&oi=ao">Dr. Usman Ghani Khan</a> and <a href="https://scholar.google.com/citations?user=PlJD884AAAAJ&hl=en&oi=ao">Dr. Farheen Ramzan</a>. I was co-supervised and mentored by <a href="https://scholar.google.com/citations?user=GT0gkZQAAAAJ&hl=en&oi=ao">Dr. Sadaf Hina</a> in Cyber Security and AI Safety.
  - I am broadly interested in data-efficient learning for visual recognition, particularly in learning robust representations from limited data. My research interests span Medical Image Computing, Remote Sensing, and Agricultural AI. I am especially interested in developing robust, accurate, and interpretable methods that improve data and label efficiency across diverse visual recognition tasks.
